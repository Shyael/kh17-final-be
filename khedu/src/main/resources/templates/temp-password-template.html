<div style="width:100%;max-width:680px;margin:0 auto;background-color:#ffffff;border:1px solid #e1e5e9;border-radius:16px;overflow:hidden;font-family:Arial,'Noto Sans KR',sans-serif;color:#222222;box-sizing:border-box;">

        <div style="margin:0;font-size:25px;line-height:1.4;font-weight:700;">

    </div>

    <div style="padding:34px;">

        <div

        <div

            <div style="margin:0 0 15px;font-size:13px;line-height:1.6;color:#78909c;">
                아래 비밀번호를 드래그한 뒤 복사해 주세요.
            </div>

                    class="password-text"
                    style="display:block;width:100%;min-height:54px;padding:12px 18px;background-color:#ffffff;border:2px solid #546e7a;border-radius:8px;box-sizing:border-box;font-family:Consolas,Monaco,'Courier New',monospace;font-size:23px;line-height:26px;font-weight:700;letter-spacing:6px;text-align:center;color:#263238;white-space:nowrap;overflow:hidden;user-select:text;-webkit-user-select:text;-moz-user-select:text;">

        </div>

        <div style="margin:0;font-size:14px;line-height:1.8;color:#78909c;">

    </div>
</div>
